services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env     
    expose:
      - "8080"              # only visible inside Docker network, not to internet
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"             # HTTP (Caddy auto-redirects to HTTPS)
      - "443:443"           # HTTPS
      - "443:443/udp"       # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data    # stores TLS certs (survives restarts)
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - app

networks:
  web:

volumes:
  caddy_data:
  caddy_config: